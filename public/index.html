<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV Builder – Tu hoja de vida en línea</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="barra">
  <div class="marca"><span class="logo">CV</span> CV Builder</div>
  <nav id="menu" class="oculto">
    <button data-vista="datos">Datos personales</button>
    <button data-vista="formacion">Formación</button>
    <button data-vista="experiencia">Experiencia</button>
    <button data-vista="habilidades">Habilidades</button>
    <button data-vista="referencias">Referencias</button>
    <button data-vista="vista">Mi hoja de vida</button>
    <button id="salir" class="sec">Salir</button>
  </nav>
</header>
<main id="app"></main>
<div id="aviso" class="aviso oculto" role="status"></div>
<!-- Módulos del front-end: cada archivo es un componente reutilizable -->
<script src="js/validaciones.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/secciones.js"></script>
<script src="js/vista.js"></script>
<script src="js/app.js"></script>
</body>
</html>
